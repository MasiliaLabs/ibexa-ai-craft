services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'
            $cache: '@cache.app'

    Masilia\Bundle\IbexaAiCraft\Support\Conventions:
        factory: ['Masilia\Bundle\IbexaAiCraft\Support\Conventions', 'fromSettings']
        arguments: ['%ibexa_ai_craft.conventions%']

    Masilia\Bundle\IbexaAiCraft\Catalog\:
        resource: '../../Catalog/'

    Masilia\Bundle\IbexaAiCraft\Mining\:
        resource: '../../Mining/'
        exclude: '../../Mining/PagePatterns.php'

    Masilia\Bundle\IbexaAiCraft\Command\:
        resource: '../../Command/'

    Masilia\Bundle\IbexaAiCraft\Site\:
        resource: '../../Site/'
        exclude: '../../Site/ExplorationResult.php'

    # Capabilities and the skill are registered by the interfaces they implement.
    Masilia\Bundle\IbexaAiCraft\Capability\:
        resource: '../../Capability/'

    Masilia\Bundle\IbexaAiCraft\Skill\:
        resource: '../../Skill/'

    # Steps added to `masilia:ai:os:selftest` (found by the interface they implement).
    Masilia\Bundle\IbexaAiCraft\Selftest\:
        resource: '../../Selftest/'
        exclude: '../../Selftest/RequiredFields.php'
