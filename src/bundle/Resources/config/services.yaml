services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'
            $cache: '@cache.app'

    Masilia\IbexaAiCraft\Support\Conventions:
        factory: ['Masilia\IbexaAiCraft\Support\Conventions', 'fromSettings']
        arguments: ['%ibexa_ai_craft.conventions%']

    Masilia\IbexaAiCraft\Catalog\:
        resource: '../../../lib/Catalog/'

    Masilia\IbexaAiCraft\Mining\:
        resource: '../../../lib/Mining/'
        exclude: '../../../lib/Mining/PagePatterns.php'

    Masilia\Bundle\IbexaAiCraft\Command\:
        resource: '../../Command/'

    Masilia\IbexaAiCraft\Site\:
        resource: '../../../lib/Site/'
        exclude: '../../../lib/Site/ExplorationResult.php'

    # Capabilities and the skill are registered by the interfaces they implement.
    Masilia\IbexaAiCraft\Capability\:
        resource: '../../../lib/Capability/'

    Masilia\IbexaAiCraft\Capability\ThemeCreateCapability:
        arguments:
            $enabled: '%ibexa_ai_craft.theme_creation%'

    Masilia\IbexaAiCraft\Skill\:
        resource: '../../../lib/Skill/'

    # Steps added to `masilia:ai:os:selftest` (found by the interface they implement).
    Masilia\IbexaAiCraft\Selftest\:
        resource: '../../../lib/Selftest/'
        exclude: '../../../lib/Selftest/RequiredFields.php'
