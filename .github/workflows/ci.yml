name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
        steps:
            - uses: actions/checkout@v4
            # masilia/ibexa-ai and masilia/ibexa-blocks are private: the key of a machine user (or deploy keys) that can read
            # both repositories, stored as the secret MASILIA_PACKAGES_SSH_KEY.
            - uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.MASILIA_PACKAGES_SSH_KEY }}
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, dom, gd, intl, pdo_mysql, sodium, xsl
                  coverage: none
            - run: composer validate --strict
            - run: composer install --no-interaction --prefer-source --no-progress
            - run: vendor/bin/phpunit
            # The remarks known when the baseline was made are in phpstan-baseline.neon; a new one fails the build.
            - run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
